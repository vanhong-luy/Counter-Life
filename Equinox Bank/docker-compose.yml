services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: '1.0'
    mem_limit: 1536M
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joelchan}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bank}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-joelchan} -d ${POSTGRES_DB:-bank}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1GB
    networks:
      - bank-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    cpus: '0.5'
    mem_limit: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  mongodb:
    image: mongo:7
    restart: unless-stopped
    cpus: '0.5'
    mem_limit: 512M
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.admin-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bank}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-joelchan}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: bank_analytics
      JWT_SECRET: ${JWT_SECRET}
      CLOUDFLARE_R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      CLOUDFLARE_R2_SECRET_KEY: ${R2_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    cpus: '1.0'
    mem_limit: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - bank-network

  user-api:
    build:
      context: .
      dockerfile: Dockerfile.user-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./simulator/samples:/samples:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bank}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-joelchan}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: bank_analytics
      JWT_SECRET: ${JWT_SECRET}
      CLOUDFLARE_R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      CLOUDFLARE_R2_SECRET_KEY: ${R2_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEED_SAMPLES_DIR: /samples
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    cpus: '1.0'
    mem_limit: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - bank-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: '0.5'
    mem_limit: 256M
    ports:
      - "3000:3000"
    environment:
      ADMIN_API_URL: http://admin-api:8081
      USER_API_URL: http://user-api:8082
    depends_on:
      - admin-api
      - user-api
    networks:
      - bank-network

volumes:
  pgdata:
  mongodb_data:

networks:
  bank-network:
    driver: bridge
