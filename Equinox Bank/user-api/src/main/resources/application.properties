spring.config.import=optional:classpath:application-secrets.properties

# -----------------------------
# Core Application Settings
# -----------------------------
spring.application.name=bank
server.port=8082

# -----------------------------
# PostgreSQL Database Connection
# -----------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/bank
spring.datasource.username=joelchan

spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=30

# -----------------------------
# JPA & Hibernate Settings
# -----------------------------
# Flyway handles schema creation and migrations; Hibernate validates entity mappings.
spring.jpa.hibernate.ddl-auto=validate

# Tells Hibernate to use PostgreSQL-specific SQL commands
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# Prints the SQL queries in your console so you can see what Spring is doing
# WARNING: Enabling this during seed/simulator runs will SIGNIFICANTLY slow things down
#          due to millions of console I/O writes.
spring.jpa.show-sql=false

# Forces Hibernate to use the exact names from your Java classes for database columns 
# (Instead of automatically converting camelCase to snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------------
# Flyway Database Migrations
# -----------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -----------------------------
# JWT Configuration
# -----------------------------
# Secret key for signing JWTs. Must be a BASE64-encoded string of at least 256 bits.
jwt.secret=${JWT_SECRET}

# -----------------------------
# Redis Configuration
# -----------------------------
# Used by TokenBlacklistService for JWT logout blacklisting and password reset tokens.
# Requires a running Redis instance on localhost:6379 (default).
spring.data.redis.host=localhost
spring.data.redis.port=6379

# -----------------------------
# Redis Cache Configuration
# -----------------------------
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# -----------------------------
# MongoDB Configuration
# -----------------------------
# Used by AnalyticsService to store unstructured analytics documents.
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=bank_analytics

# -----------------------------
# Cloudflare R2 Configuration
# -----------------------------
cloudflare.r2.endpoint=https://031f6633edce4e2aed10d0c9b80c1e68.r2.cloudflarestorage.com
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
cloudflare.r2.bucket-name=bank

# -----------------------------
# Seed Simulation
# -----------------------------
seed.samples.dir=${SEED_SAMPLES_DIR:./simulator/samples}

# -----------------------------
# File Upload Limits
# -----------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
