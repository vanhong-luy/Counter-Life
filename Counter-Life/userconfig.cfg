// Counter-Life tweaks. This file is exec'd at startup via config.cfg.
// (autoexec.cfg is NOT read by this engine, so put startup commands here.)
// Delete this file to revert.

// Apply the mod's skill values (monster/NPC health, damage, etc.).
// Without this the friendly NPCs can end up with no valid health, and then
// when a scripted_sequence finishes they "drop out because he got killed"
// (see CBaseMonster::CineCleanup): they fall over with a death scream but
// stay interactable and never move, softlocking spots where they must act.
exec skill.cfg

// Cap the framerate. GoldSource ties physics/AI to the frame rate; too high
// desyncs NPCs (they "fall"/loop pain screams) and can softlock scripted
// actions such as opening a door. The engine default here is 80.
fps_max "60"
